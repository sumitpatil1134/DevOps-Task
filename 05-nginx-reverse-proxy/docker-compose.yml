services:

  app:
    build: .
    container_name: devops-nginx-app
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/devopsdb
    expose:
      - "3000"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: devops-nginx-mongo
    volumes:
      - mongo-data:/data/db

  nginx:
    image: nginx:alpine
    container_name: devops-nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  mongo-data:
