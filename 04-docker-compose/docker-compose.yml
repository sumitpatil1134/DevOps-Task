services:

  app:
    build: .
    container_name: devops-compose-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/devopsdb
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: devops-compose-mongo
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
