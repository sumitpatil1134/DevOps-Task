name: DevOps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 05-nginx-reverse-proxy/package-lock.json

      - name: Install dependencies
        working-directory: 05-nginx-reverse-proxy
        run: npm ci

      - name: Run tests
        working-directory: 05-nginx-reverse-proxy
        run: npm test

      - name: Check required files
        working-directory: 05-nginx-reverse-proxy
        run: |
          test -f package.json
          test -f package-lock.json
          test -f server.js
          test -f Dockerfile

      - name: Build Docker image
        working-directory: 05-nginx-reverse-proxy
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-nginx-app:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-nginx-app:latest \
            .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image with commit SHA
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-nginx-app:${{ github.sha }}

      - name: Push latest image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-nginx-app:latest
